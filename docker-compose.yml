version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: repair_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-repair123}
      MYSQL_DATABASE: ${DB_NAME:-repair_db}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - repair_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repair_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-repair123}
      DB_NAME: ${DB_NAME:-repair_db}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - repair_net
    depends_on:
      db:
        condition: service_healthy

  # Nginx 反向代理 + 前端静态文件
  nginx:
    image: nginx:alpine
    container_name: repair_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/app/uploads:ro
    networks:
      - repair_net
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:

networks:
  repair_net:
    driver: bridge
